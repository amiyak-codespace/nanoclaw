services:
  nanoclaw:
    build:
      context: .
      dockerfile: Dockerfile # Ensure this matches your actual Dockerfile name
    container_name: nanoclaw
    restart: unless-stopped
    
    environment:
      - WHATSAPP_ENABLED=true
      - GOOGLE_API_KEY=AIzaSyCkEVSGkfAYnKXJzksHSn1RHafN1xZRRAo
      - TZ=Asia/Kolkata
      - HOST_PROJECT_ROOT=/Users/amiyakumar.m/Ws/ai-space/nanoclaw
      - HOST_STORE_DIR=/Users/amiyakumar.m/Ws/ai-space/nanoclaw_store
      - HOST_DATA_DIR=/Users/amiyakumar.m/Ws/ai-space/nanoclaw_data
      - HOST_WORKSPACE_DIR=/Users/amiyakumar.m/Ws/ai-space/ai-engineer
      # Tells the agent to look for GEMINI.md for instructions
      - AGENT_RULES_FILE=/app/workspace/GEMINI.md 
    
    volumes:
      - /Users/amiyakumar.m/Ws/ai-space/ai-engineer:/app/workspace
      - /Users/amiyakumar.m/Ws/ai-space/nanoclaw_store:/app/store
      - /Users/amiyakumar.m/Ws/ai-space/nanoclaw_data:/app/data
      # --- THE CRITICAL ADDITION ---
      - /var/run/docker.sock:/var/run/docker.sock
    
    ports:
      - "18789:18789" # Gateway UI
    
    # c7i-flex.large has 4GB RAM. This prevents the AI from crashing the host.
    deploy:
      resources:
        limits:
          memory: 2g
